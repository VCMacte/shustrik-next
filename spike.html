<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Шустрик — спайк</title>
    <style>
      /* Крупно и заливкой, а не рамкой: Miracast режет цветность сильнее
         светлоты, тонкая рамка через него не доживает (CLAUDE.md). Числа
         читаются с полутора метров — их смотрят, стоя у штатива. */
      html, body { margin: 0; height: 100%; background: #10161e; color: #eef3f8;
        font: 500 20px/1.3 system-ui, sans-serif; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; }
      .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .screen[hidden] { display: none; }

      /* ── калитка ── */
      #gate { align-items: center; justify-content: center; gap: 18px; padding: 20px; }
      #gate h1 { margin: 0; font-size: 26px; font-weight: 700; }
      #gateStart { border: 0; border-radius: 14px; background: #3f7d3a; color: #fff;
        font: 700 26px/1.2 system-ui, sans-serif; padding: 24px 44px; }
      #gateStart:active { background: #4f9a48; }
      #gateStart small { display: block; font: 500 14px/1.3 system-ui, sans-serif;
        opacity: .85; margin-top: 6px; }
      #gate p { margin: 0; max-width: 28em; text-align: center; font-size: 15px; opacity: .7; }

      /* ── пульт ── */
      #pult { padding: 14px; gap: 10px; }
      /* Плитки занимают ЭКРАН, а не строчку сверху: на них жмут, стоя у
         штатива, и читают их оттуда же. */
      #tiles { flex: 1; min-height: 0; display: grid; gap: 10px;
        grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
      .tile { border: 0; border-radius: 12px; background: #2e4a63; color: #eef3f8;
        font: inherit; text-align: left; padding: 16px; display: flex;
        flex-direction: column; justify-content: center; gap: 6px; }
      .tile:active { background: #4b7aa3; }
      /* Пройденный прогон — ЗАЛИВКОЙ и словом, а не галочкой и не тоном:
         через Miracast значок размером в букву пропадает первым. */
      .tile.played { background: #223445; }
      .tile b { font-size: 24px; font-weight: 700; }
      .tile span { font-size: 16px; opacity: .8; }
      .tile i { font-style: normal; font-size: 17px; font-weight: 700; color: #9ad48f; }
      #pultRow { display: flex; gap: 10px; }
      #pultRow button { flex: 1; border: 0; border-radius: 10px; background: #2e4a63;
        color: #eef3f8; font: inherit; padding: 14px 12px; }
      #pultRow button:active { background: #4b7aa3; }
      #pultMsg { margin: 0; font-size: 14px; opacity: .75; min-height: 1.3em; }

      /* ── прогон ── */
      #run { position: relative; }
      #stage { flex: 1; width: 100%; display: block; background: #0b1016; min-height: 0; }
      /* Малый буфер растягивается БЛИЖАЙШИМ СОСЕДОМ, а не сглаживанием.
         Это и есть «пиксельный» вывод целиком: буфер 480×270 (см.
         `src/render/buffer.ts`) растягивает композитор браузера даром —
         отдельного прохода нет, и замер не платит за то, чего в игре не
         будет. Сглаживание здесь мылило бы ровно то, ради чего прогон
         затеян: крупный пиксель — единственная форма, которая доживает до
         телевизора через сжатие Miracast (CLAUDE.md). Класс вешает и
         снимает `runLive` на каждом прогоне. */
      #stage.pixel { image-rendering: pixelated; }
      /* Подпись лежит поверх картинки, а небо бывает светлым: без собственной
         заливки белый текст по светлому небу через Miracast исчезает. */
      #runLabel { position: absolute; top: 8px; left: 10px; font-size: 15px;
        background: #10161e; border-radius: 10px; padding: 8px 12px; }
      #back { position: absolute; top: 8px; right: 10px; border: 0; border-radius: 10px;
        background: #2e4a63; color: #eef3f8; font: inherit; font-size: 15px; padding: 10px 14px; }
      #status { padding: 10px 14px; font-variant-numeric: tabular-nums; }
      /* Беда — ЗАЛИВКОЙ и крупно, а не рамкой и не тоном: Miracast режет
         цветность сильнее светлоты, и тонкая рамка через него не доживает. */
      #warn { margin: 0 14px 10px; padding: 12px 14px; border-radius: 10px;
        background: #b4451f; color: #fff; font-weight: 700; }
    </style>
  </head>
  <body>
    <!-- Калитка. Полный экран и wakeLock браузер отдаёт только по живому
         жесту, поэтому замер начинается с касания, а не с загрузки. -->
    <section id="gate" class="screen">
      <h1>Шустрик — замер</h1>
      <button id="gateStart">Начать<small>экран останется включённым</small></button>
      <p>Автоблокировку экрана в настройках телефона лучше выключить заранее:
        погасший экран останавливает кадры, и приговор снят не с игры.</p>
    </section>

    <!-- Пульт: четыре прогона таблицы спайка, мир и выгрузка журнала.
         Плитки строит `boot()` из SPIKE_RUNS — у четвёрки один владелец. -->
    <section id="pult" class="screen" hidden>
      <div id="tiles"></div>
      <div id="pultRow">
        <button id="world">Мир: —</button>
        <button id="save">Выгрузить журнал</button>
      </div>
      <p id="pultMsg"></p>
    </section>

    <!-- Прогон. Кнопок прогонов здесь нет намеренно: во время замера
         телефона не касаются, и места на экране они стоят дорого. -->
    <section id="run" class="screen" hidden>
      <canvas id="stage"></canvas>
      <div id="runLabel">—</div>
      <button id="back">В меню</button>
      <div id="status">запуск…</div>
      <div id="warn" hidden></div>
    </section>

    <script type="module">
      /* Страница зовёт `boot()` сама, а модуль не запускается при импорте:
         его проверяет прогон в `node`, где страницы нет вовсе. */
      import { boot } from '/src/shell/spike.ts'
      boot()
    </script>
  </body>
</html>
